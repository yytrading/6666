<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="6666 — looping visual sequences." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="6666" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>6666</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text: #fff;
      --quiet: rgba(255, 255, 255, .56);
      --glass: rgba(255, 255, 255, .10);
      --glass-active: rgba(255, 255, 255, .88);
      --line: rgba(255, 255, 255, .20);
      --safe-top: max(1rem, env(safe-area-inset-top));
      --safe-bottom: max(1rem, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 0; height: 100%; margin: 0; background: #000; color: var(--text); overflow: hidden; }
    body { font-family: var(--font); font-weight: 300; letter-spacing: .06em; -webkit-tap-highlight-color: transparent; user-select: none; }
    button { font: inherit; }
    button:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }

    /* The feed owns its own native vertical scrolling and therefore receives swipe gestures directly. */
    #feed {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      height: 100dvh;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      touch-action: pan-y;
      background: #000;
      -webkit-overflow-scrolling: touch;
    }
    #feed::-webkit-scrollbar { display: none; }
    .clip {
      position: relative;
      display: grid;
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
    }
    .clip video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 1000;
      opacity: 1;
      visibility: visible;
      transition: opacity .42s ease, visibility 0s linear 0s;
    }
    .screen[hidden] { display: none; }
    .screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .42s ease, visibility 0s linear .42s; }

    /* Passcode */
    #lock-screen {
      z-index: 5000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(1.9rem, 5vh, 3.2rem);
      background: #000;
      isolation: isolate;
    }
    #lock-logo {
      width: clamp(84px, 23vw, 112px);
      aspect-ratio: 1;
      border-radius: 24%;
      object-fit: cover;
      box-shadow: none;
      transform: scale(1);
      transition: transform .42s ease, box-shadow .42s ease;
    }
    #lock-logo.is-unlocking {
      transform: scale(1.1);
      box-shadow: 0 0 24px rgba(179, 106, 255, .78), 0 0 62px rgba(141, 65, 255, .58), 0 0 118px rgba(116, 42, 235, .34);
    }
    #lock-dots { display: flex; align-items: center; gap: 1.05rem; min-height: 14px; }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .16);
      transition: background .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .dot.is-filled { background: #fff; transform: scale(1.17); box-shadow: 0 0 8px rgba(255, 255, 255, .62); }
    #lock-dots.is-wrong .dot { background: #ff404a; box-shadow: 0 0 10px rgba(255, 64, 74, .82); animation: wrong .36s ease-in-out 1; }
    @keyframes wrong { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: .72rem 1rem;
      justify-items: center;
      align-items: center;
    }
    .key {
      width: 68px;
      height: 68px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 50%;
      background: rgba(255, 255, 255, .055);
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: 1.35rem;
      font-weight: 300;
      letter-spacing: .05em;
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .key:active { transform: scale(.88); background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .26); }
    .key.is-spacer { visibility: hidden; pointer-events: none; }
    .key[data-key="delete"] { font-size: .65rem; letter-spacing: .11em; text-transform: uppercase; color: var(--quiet); }

    /* Fullscreen gate: hidden until the lock unlocks. */
    #entry-screen {
      z-index: 4000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.15rem;
      background: #000;
      cursor: pointer;
    }
    #entry-screen svg { width: 48px; height: 48px; fill: none; stroke: #fff; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    #entry-screen span { color: #fff; font-size: .82rem; font-weight: 300; letter-spacing: .14em; text-transform: uppercase; }

    /* Category selection */
    #category-screen {
      z-index: 900;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2rem;
      padding: calc(var(--safe-top) + 1rem) 1.5rem calc(var(--safe-bottom) + 1rem);
      background: #000;
    }
    #category-title { margin: 0; color: #fff; font-size: 1.3rem; font-weight: 300; letter-spacing: .28em; text-transform: uppercase; }
    #categories { display: flex; max-width: 25rem; flex-wrap: wrap; justify-content: center; gap: .75rem; }
    .category {
      min-width: 7.5rem;
      padding: .78rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      color: #fff;
      cursor: pointer;
      font-size: .72rem;
      font-weight: 300;
      letter-spacing: .11em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .category:active { transform: scale(.95); background: rgba(255, 255, 255, .20); border-color: rgba(255, 255, 255, .50); }
    #empty-state { color: var(--quiet); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }

    /* Playback HUD. Its root never blocks native feed gestures. */
    #hud { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
    #counter {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: calc(var(--safe-bottom) + .5rem);
      padding: .34rem .75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, .13);
      color: #fff;
      font-size: .68rem;
      font-weight: 300;
      letter-spacing: .12em;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity .38s ease;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }
    #counter.is-visible { opacity: 1; }
    #swipe-hint {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      display: grid;
      gap: .5rem;
      place-items: center;
      color: rgba(255,255,255,.58);
      font-size: .64rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      transform: translate(-50%, -50%);
      opacity: 1;
      transition: opacity .65s ease;
    }
    #swipe-hint.is-hidden { opacity: 0; }
    #swipe-hint svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; animation: drift 1.7s ease-in-out infinite; }
    @keyframes drift { 50% { transform: translateY(9px); } }

    #controls {
      position: absolute;
      z-index: 3;
      right: max(1rem, env(safe-area-inset-right));
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .55rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(9px);
      transition: opacity .25s ease, transform .25s ease;
    }
    #controls.is-visible { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
    #speed-grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: .38rem;
      padding: .45rem;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 1rem;
      background: rgba(0, 0, 0, .34);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
    }
    .control-button, .speed {
      display: grid;
      place-items: center;
      min-width: 2.6rem;
      min-height: 2.6rem;
      padding: 0 .55rem;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      background: var(--glass);
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: .61rem;
      font-weight: 300;
      letter-spacing: .07em;
      text-transform: uppercase;
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      transition: transform .12s ease, background .12s ease, color .12s ease;
    }
    .control-button:active, .speed:active { transform: scale(.90); }
    .speed.is-active { background: var(--glass-active); color: #000; }
    #speed-grid[hidden] { display: none; }
    #speed-toggle { min-width: 3.45rem; }
    #category-toggle { font-size: 0; }
    #category-toggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }

    #live { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="feed" aria-label="6666 visual feed"></main>

  <div id="hud" aria-hidden="false">
    <div id="counter" aria-live="polite"></div>
    <div id="swipe-hint" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 4v16m-5-5 5 5 5-5" /></svg>
      <span>Swipe</span>
    </div>
    <div id="controls" aria-label="Playback controls">
      <div id="speed-grid" hidden></div>
      <button id="speed-toggle" class="control-button" type="button" aria-label="Playback speed">1.0x</button>
      <button id="category-toggle" class="control-button" type="button" aria-label="Choose category">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6" height="6" rx=".6"/><rect x="14.5" y="3.5" width="6" height="6" rx=".6"/><rect x="3.5" y="14.5" width="6" height="6" rx=".6"/><rect x="14.5" y="14.5" width="6" height="6" rx=".6"/></svg>
      </button>
    </div>
  </div>

  <section id="category-screen" class="screen" aria-label="Choose a collection">
    <h1 id="category-title">6666</h1>
    <div id="categories"></div>
    <p id="empty-state" hidden>No clips</p>
  </section>

  <section id="entry-screen" class="screen is-hidden" aria-label="Enter 6666" role="button" tabindex="0">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <span>Tap to enter</span>
  </section>

  <section id="lock-screen" class="screen" aria-label="Passcode lock">
    <img id="lock-logo" src="icon-192.png" alt="6666" />
    <div id="lock-dots" aria-label="Four digit passcode"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div id="keypad" aria-label="Numeric keypad">
      <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button>
      <button class="key is-spacer" type="button" tabindex="-1" aria-hidden="true"></button><button class="key" type="button" data-key="0">0</button><button class="key" type="button" data-key="delete">Del</button>
    </div>
  </section>
  <div id="live" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      'use strict';
      const PASSCODE = '7788';
      const SPEEDS = Array.from({ length: 11 }, (_, i) => Number((0.5 + i * 0.1).toFixed(1)));
      const $ = (selector) => document.querySelector(selector);
      const feed = $('#feed');
      const lockScreen = $('#lock-screen');
      const entryScreen = $('#entry-screen');
      const categoryScreen = $('#category-screen');
      const categoryList = $('#categories');
      const emptyState = $('#empty-state');
      const lockDots = [...document.querySelectorAll('.dot')];
      const lockDotsWrap = $('#lock-dots');
      const lockLogo = $('#lock-logo');
      const controls = $('#controls');
      const speedGrid = $('#speed-grid');
      const speedToggle = $('#speed-toggle');
      const categoryToggle = $('#category-toggle');
      const counter = $('#counter');
      const hint = $('#swipe-hint');
      const live = $('#live');
      const state = { categories: [], clips: [], category: null, active: 0, speed: Number(sessionStorage.getItem('6666-speed') || 1), observer: null, controlsTimer: null, counterTimer: null, wakeLock: null, downY: 0, usingPointer: false };

      function escapeText(value) { return String(value || '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[ch]); }
      function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone === true; }
      function hideScreen(el) { el.classList.add('is-hidden'); window.setTimeout(() => { el.hidden = true; }, 440); }
      function showScreen(el) { el.hidden = false; requestAnimationFrame(() => el.classList.remove('is-hidden')); }
      function normalizePlaylist(data) {
        if (!Array.isArray(data)) return [];
        if (data[0]?.clips) return data.filter(group => Array.isArray(group.clips) && group.clips.length);
        return data.length ? [{ name: 'All', clips: data }] : [];
      }

      async function loadPlaylist() {
        try {
          const response = await fetch('clips.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('clips unavailable');
          state.categories = normalizePlaylist(await response.json());
        } catch (_) {
          state.categories = [];
        }
        renderCategories();
      }

      function renderCategories() {
        categoryList.replaceChildren();
        emptyState.hidden = state.categories.length > 0;
        state.categories.forEach((category) => {
          const button = document.createElement('button');
          button.className = 'category';
          button.type = 'button';
          button.textContent = category.name;
          button.setAttribute('aria-label', `${category.name}, ${category.clips.length} clips`);
          button.addEventListener('click', () => openCategory(category));
          categoryList.append(button);
        });
      }

      function sourceFor(clip) { return encodeURI(String(clip.src || '').replace(/^\/+/, '')); }
      function createClip(clip, index) {
        const article = document.createElement('article');
        article.className = 'clip';
        article.dataset.index = index;
        article.setAttribute('aria-label', `Clip ${index + 1} of ${state.clips.length}`);
        const video = document.createElement('video');
        video.loop = true;
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('muted', '');
        video.dataset.src = sourceFor(clip);
        video.dataset.index = index;
        article.append(video);
        return article;
      }

      function hydrate(index) {
        const video = feed.querySelector(`video[data-index="${index}"]`);
        if (video && !video.src) { video.src = video.dataset.src; video.load(); }
        return video;
      }
      function prepareAround(index) {
        for (let i = Math.max(0, index - 1); i <= Math.min(state.clips.length - 1, index + 1); i++) hydrate(i);
      }
      function playActive() {
        if (!state.clips.length) return;
        prepareAround(state.active);
        feed.querySelectorAll('video').forEach((video, index) => {
          video.playbackRate = state.speed;
          if (index !== state.active) video.pause();
        });
        const active = hydrate(state.active);
        if (active) active.play().catch(() => {});
        requestWakeLock();
      }
      function setActive(index, announce = true) {
        if (!state.clips.length || index < 0 || index >= state.clips.length || index === state.active && counter.textContent) return;
        state.active = index;
        playActive();
        showCounter();
        if (announce) live.textContent = `Clip ${index + 1} of ${state.clips.length}`;
      }
      function showCounter() {
        counter.textContent = `${state.active + 1} / ${state.clips.length}`;
        counter.classList.add('is-visible');
        clearTimeout(state.counterTimer);
        state.counterTimer = setTimeout(() => counter.classList.remove('is-visible'), 2400);
      }
      function scrollToIndex(index) {
        const target = Math.max(0, Math.min(state.clips.length - 1, index));
        feed.scrollTo({ top: target * feed.clientHeight, behavior: 'smooth' });
      }

      function observeFeed() {
        state.observer?.disconnect();
        state.observer = new IntersectionObserver((entries) => {
          const visible = entries.filter(entry => entry.isIntersecting && entry.intersectionRatio >= .62).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (visible) setActive(Number(visible.target.dataset.index));
        }, { root: feed, threshold: [.45, .62, .8] });
        [...feed.querySelectorAll('.clip')].forEach(clip => state.observer.observe(clip));
      }

      function openCategory(category) {
        state.category = category;
        state.clips = category.clips.filter(clip => clip?.src);
        state.active = 0;
        hideScreen(categoryScreen);
        hideControls();
        feed.replaceChildren(...state.clips.map(createClip));
        feed.scrollTo({ top: 0, behavior: 'instant' });
        observeFeed();
        prepareAround(0);
        window.setTimeout(() => { playActive(); showCounter(); }, 80);
        if (sessionStorage.getItem('6666-swipe-hint')) hint.classList.add('is-hidden');
        else setTimeout(() => { hint.classList.add('is-hidden'); sessionStorage.setItem('6666-swipe-hint', '1'); }, 2600);
      }
      function chooseCategory() {
        feed.querySelectorAll('video').forEach(video => video.pause());
        showScreen(categoryScreen);
        hideControls();
      }

      function buildSpeeds() {
        speedGrid.replaceChildren();
        SPEEDS.forEach((speed) => {
          const button = document.createElement('button');
          button.className = 'speed';
          button.type = 'button';
          button.dataset.speed = speed;
          button.textContent = `${speed.toFixed(1)}x`;
          button.setAttribute('aria-label', `Set playback speed to ${speed.toFixed(1)}x`);
          button.addEventListener('click', (event) => { event.stopPropagation(); setSpeed(speed); showControls(); });
          speedGrid.append(button);
        });
        setSpeed(state.speed, false);
      }
      function setSpeed(speed, announce = true) {
        state.speed = speed;
        sessionStorage.setItem('6666-speed', speed);
        speedToggle.textContent = `${speed.toFixed(1)}x`;
        speedGrid.querySelectorAll('.speed').forEach(button => button.classList.toggle('is-active', Number(button.dataset.speed) === speed));
        feed.querySelectorAll('video').forEach(video => { video.playbackRate = speed; });
        if (announce) live.textContent = `${speed.toFixed(1)}x speed`;
      }
      function showControls() { controls.classList.add('is-visible'); clearTimeout(state.controlsTimer); state.controlsTimer = setTimeout(hideControls, 2500); }
      function hideControls() { controls.classList.remove('is-visible'); speedGrid.hidden = true; clearTimeout(state.controlsTimer); }

      async function requestWakeLock() {
        if (!('wakeLock' in navigator) || document.hidden || state.wakeLock) return;
        try { state.wakeLock = await navigator.wakeLock.request('screen'); state.wakeLock.addEventListener('release', () => { state.wakeLock = null; }); } catch (_) {}
      }
      function releaseWakeLock() { state.wakeLock?.release?.(); state.wakeLock = null; }

      function enterApp() {
        const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        if (!isStandalone() && request) Promise.resolve(request.call(document.documentElement)).catch(() => {});
        hideScreen(entryScreen);
        if (state.categories.length === 1) openCategory(state.categories[0]);
        else showScreen(categoryScreen);
      }

      function unlock() {
        lockLogo.classList.add('is-unlocking');
        setTimeout(() => {
          hideScreen(lockScreen);
          setTimeout(() => {
            if (isStandalone()) {
              if (state.categories.length === 1) openCategory(state.categories[0]);
              else showScreen(categoryScreen);
            } else showScreen(entryScreen);
          }, 420);
        }, 600);
      }
      function setupLock() {
        let digits = '';
        const updateDots = () => lockDots.forEach((dot, index) => dot.classList.toggle('is-filled', index < digits.length));
        const wrongCode = () => {
          lockDotsWrap.classList.add('is-wrong');
          digits = '';
          setTimeout(() => { lockDotsWrap.classList.remove('is-wrong'); updateDots(); }, 560);
        };
        const input = (key) => {
          if (key === 'delete') { digits = digits.slice(0, -1); updateDots(); return; }
          if (!/^\d$/.test(key) || digits.length >= 4) return;
          digits += key; updateDots();
          if (digits.length === 4) setTimeout(() => { digits === PASSCODE ? unlock() : wrongCode(); }, 140);
        };
        $('#keypad').addEventListener('click', (event) => { const key = event.target.closest('[data-key]')?.dataset.key; if (key) input(key); });
        document.addEventListener('keydown', (event) => {
          if (lockScreen.hidden || lockScreen.classList.contains('is-hidden')) return;
          if (/^\d$/.test(event.key)) input(event.key);
          if (event.key === 'Backspace') input('delete');
        });
      }

      function setupInteractions() {
        feed.addEventListener('pointerdown', (event) => { state.usingPointer = true; state.downY = event.clientY; }, { passive: true });
        feed.addEventListener('pointerup', (event) => {
          if (Math.abs(event.clientY - state.downY) < 10) showControls();
        }, { passive: true });
        feed.addEventListener('scroll', () => { hint.classList.add('is-hidden'); sessionStorage.setItem('6666-swipe-hint', '1'); }, { passive: true });
        speedToggle.addEventListener('click', (event) => { event.stopPropagation(); speedGrid.hidden = !speedGrid.hidden; showControls(); });
        categoryToggle.addEventListener('click', (event) => { event.stopPropagation(); chooseCategory(); });
        entryScreen.addEventListener('click', enterApp);
        entryScreen.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); enterApp(); } });
        document.addEventListener('keydown', (event) => {
          if (!lockScreen.hidden && !lockScreen.classList.contains('is-hidden')) return;
          if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { event.preventDefault(); scrollToIndex(state.active + 1); }
          if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { event.preventDefault(); scrollToIndex(state.active - 1); }
          if (event.key === 'Home') { event.preventDefault(); scrollToIndex(0); }
          if (event.key === 'End') { event.preventDefault(); scrollToIndex(state.clips.length - 1); }
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { feed.querySelector(`video[data-index="${state.active}"]`)?.pause(); releaseWakeLock(); }
          else playActive();
        });
        window.addEventListener('resize', () => { if (state.clips.length) feed.scrollTo({ top: state.active * feed.clientHeight, behavior: 'instant' }); }, { passive: true });
      }

      buildSpeeds();
      setupLock();
      setupInteractions();
      loadPlaylist();
      if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    })();
  </script>
</body>
</html>
