<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Mesmerize - looping animations. Swipe to explore." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mesmerize" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <title>Mesmerize</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dur: 380ms;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
    }

    /* Skip link */
    .skip {
      position: absolute; top: -100%; left: 50%;
      transform: translateX(-50%);
      background: #fff; color: #000;
      padding: .6rem 1.4rem; border-radius: 0 0 .5rem .5rem;
      font-size: .95rem; font-weight: 600;
      z-index: 9999; text-decoration: none;
      transition: top .15s;
    }
    .skip:focus { top: 0; }

    /* SR-only live region */
    #live {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap;
    }

    /* Stage */
    #stage {
      position: fixed; inset: 0;
    }

    /* Slides */
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      will-change: transform, opacity;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .slide.no-transition { transition: none !important; }

    .slide[data-pos="prev"] { transform: translateX(-100%); opacity: 0; }
    .slide[data-pos="curr"] { transform: translateX(0);     opacity: 1; }
    .slide[data-pos="next"] { transform: translateX(100%);  opacity: 0; }
    .slide[data-pos="off"]  { transform: translateX(200%);  opacity: 0; visibility: hidden; }

    /* Video */
    .slide video {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* Counter */
    #counter {
      position: fixed;
      bottom: max(1.25rem, env(safe-area-inset-bottom, 1.25rem));
      left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.13);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: .75rem; letter-spacing: .1em;
      padding: .3rem .8rem; border-radius: 999px;
      pointer-events: none; z-index: 100;
      opacity: 1; transition: opacity .5s ease;
    }
    #counter.fade { opacity: 0; }

    /* Swipe hint */
    #hint {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .6rem;
      pointer-events: none; z-index: 200;
      opacity: 1; transition: opacity .7s ease;
    }
    #hint.gone { opacity: 0; }
    #hint svg {
      width: 2.2rem; height: 2.2rem;
      stroke: rgba(255,255,255,.65); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      animation: sw 1.8s ease-in-out infinite;
    }
    #hint p {
      color: rgba(255,255,255,.5);
      font-size: .78rem; letter-spacing: .14em; text-transform: uppercase;
    }
    @keyframes sw {
      0%,100% { transform: translateX(0); }
      40%,60%  { transform: translateX(-1rem); }
    }

    /* Fullscreen prompt */
    #fs-prompt {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.2rem;
      background: #000;
      z-index: 300;
      cursor: pointer;
      transition: opacity .4s ease;
    }
    #fs-prompt.gone { opacity: 0; pointer-events: none; }
    #fs-prompt svg {
      width: 3rem; height: 3rem;
      stroke: rgba(255,255,255,.7); fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    #fs-prompt p {
      color: rgba(255,255,255,.6);
      font-size: .85rem; letter-spacing: .14em; text-transform: uppercase;
    }
    #fs-prompt small {
      color: rgba(255,255,255,.3);
      font-size: .7rem; letter-spacing: .08em;
    }
  </style>
</head>
<body>

<a class="skip" href="#stage">Skip to animations</a>

<!-- Fullscreen entry prompt (shown on first visit, hidden after tap) -->
<div id="fs-prompt" role="button" tabindex="0" aria-label="Tap to enter fullscreen">
  <svg viewBox="0 0 24 24">
    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
  </svg>
  <p>Tap to enter</p>
  <small>or add to home screen for best experience</small>
</div>
<div id="live" aria-live="polite" aria-atomic="true" role="status"></div>

<main id="stage" role="main" aria-label="Animation gallery. Use arrow keys or swipe to navigate.">
</main>

<div id="counter" aria-hidden="true"></div>

<div id="hint" role="presentation" aria-hidden="true">
  <svg viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
  <p>Swipe to explore</p>
</div>

<script>
// ── Clips ──────────────────────────────────────────────────────────
// Videos are hosted in the same folder as this HTML file.
// To add more: just add entries here and put the .mp4 file alongside index.html.
const CLIPS = [
  { src: '1.mp4', label: 'Animation 1' },
  { src: '3.mp4', label: 'Animation 2' },
];

// ── Build slides ───────────────────────────────────────────────────
const stage   = document.getElementById('stage');
const counter = document.getElementById('counter');
const live    = document.getElementById('live');
const hint    = document.getElementById('hint');
const N       = CLIPS.length;
let   cur     = 0;

const slides = CLIPS.map((clip, i) => {
  const el  = document.createElement('div');
  el.className = 'slide no-transition';
  el.setAttribute('role', 'region');
  el.setAttribute('aria-label', `${clip.label}, ${i + 1} of ${N}`);
  el.dataset.index = i;

  const vid = document.createElement('video');
  vid.loop        = true;
  vid.muted       = true;
  vid.playsInline = true;
  vid.preload     = i === 0 ? 'auto' : 'metadata';
  vid.setAttribute('aria-label', clip.label);

  const src = document.createElement('source');
  src.src  = clip.src;
  src.type = 'video/mp4';
  vid.appendChild(src);
  el.appendChild(vid);
  stage.appendChild(el);
  return { el, vid };
});

// ── Position helpers ───────────────────────────────────────────────
function pos(i) {
  if (i === cur)     return 'curr';
  if (i === cur - 1) return 'prev';
  if (i === cur + 1) return 'next';
  return 'off';
}

function layout(animate) {
  slides.forEach(({ el }, i) => {
    if (!animate) el.classList.add('no-transition');
    else          el.classList.remove('no-transition');
    el.dataset.pos = pos(i);
    el.setAttribute('aria-hidden', i === cur ? 'false' : 'true');
  });
  // Force reflow so no-transition actually takes effect before we remove it
  if (!animate) stage.getBoundingClientRect();
}

// ── Playback ────────────────────────────────────────────────────────
function play(i) {
  slides.forEach(({ vid }, j) => {
    if (j === i) { vid.currentTime = 0; vid.play().catch(() => {}); }
    else         { vid.pause(); }
  });
}

// ── Navigate ────────────────────────────────────────────────────────
let counterTimer;

function goTo(i, announce = true) {
  if (i < 0 || i >= N) return;
  cur = i;
  layout(true);
  play(cur);

  counter.textContent = `${cur + 1} / ${N}`;
  counter.classList.remove('fade');
  clearTimeout(counterTimer);
  counterTimer = setTimeout(() => counter.classList.add('fade'), 2400);

  if (announce) live.textContent = `${CLIPS[cur].label}, ${cur + 1} of ${N}`;
}

const next = () => goTo(cur + 1);
const prev = () => goTo(cur - 1);

// ── Drag / swipe ────────────────────────────────────────────────────
const THRESH_PX = 55;
const THRESH_V  = 0.35; // px/ms

let dragging = false, startX = 0, dx = 0, t0 = 0;

function dragStart(x) {
  dragging = true; startX = x; dx = 0; t0 = Date.now();
  slides.forEach(({ el }) => el.classList.add('no-transition'));
}

function dragMove(x) {
  if (!dragging) return;
  dx = x - startX;
  slides.forEach(({ el }, i) => {
    if (i === cur)     el.style.transform = `translateX(${dx}px)`;
    else if (i === cur - 1) el.style.transform = `translateX(calc(-100% + ${dx}px))`;
    else if (i === cur + 1) el.style.transform = `translateX(calc(100% + ${dx}px))`;
  });
  // Fade in the approaching slide
  const adj = dx < 0 ? slides[cur + 1] : slides[cur - 1];
  if (adj) adj.el.style.opacity = Math.min(Math.abs(dx) / 100, 1);
}

function dragEnd() {
  if (!dragging) return;
  dragging = false;

  // Clear inline styles
  slides.forEach(({ el }) => { el.style.transform = ''; el.style.opacity = ''; });

  const v = Math.abs(dx) / (Date.now() - t0);
  const commit = Math.abs(dx) > THRESH_PX || v > THRESH_V;

  if      (commit && dx < 0) next();
  else if (commit && dx > 0) prev();
  else { layout(true); } // snap back
}

// Touch
stage.addEventListener('touchstart', e => { if (e.touches.length === 1) dragStart(e.touches[0].clientX); }, { passive: true });
stage.addEventListener('touchmove',  e => dragMove(e.touches[0].clientX), { passive: true });
stage.addEventListener('touchend',   dragEnd);
stage.addEventListener('touchcancel', dragEnd);

// Mouse (desktop)
stage.addEventListener('mousedown', e => { e.preventDefault(); dragStart(e.clientX); });
window.addEventListener('mousemove', e => { if (dragging) dragMove(e.clientX); });
window.addEventListener('mouseup',   () => { if (dragging) dragEnd(); });

// ── Keyboard ────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); prev(); }
  if (e.key === 'Home') { e.preventDefault(); goTo(0); }
  if (e.key === 'End')  { e.preventDefault(); goTo(N - 1); }
});

// ── Visibility ──────────────────────────────────────────────────────
document.addEventListener('visibilitychange', () => {
  if (document.hidden) slides[cur]?.vid.pause();
  else                 slides[cur]?.vid.play().catch(() => {});
});

// ── Reduced motion ──────────────────────────────────────────────────
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
const applyMotion = q => document.documentElement.style.setProperty('--dur', q.matches ? '0ms' : '380ms');
applyMotion(mq);
mq.addEventListener('change', applyMotion);

// ── Fullscreen prompt ────────────────────────────────────────────────
const fsPrompt = document.getElementById('fs-prompt');

function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) req.call(el).catch(() => {});
  fsPrompt.classList.add('gone');
  setTimeout(() => fsPrompt.remove(), 500);
}

// If already fullscreen (e.g. opened from home screen PWA), skip prompt
if (document.fullscreenElement || window.navigator.standalone ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    window.matchMedia('(display-mode: standalone)').matches) {
  fsPrompt.classList.add('gone');
  setTimeout(() => fsPrompt.remove(), 100);
} else {
  fsPrompt.addEventListener('click', enterFullscreen);
  fsPrompt.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') enterFullscreen(); });
}

// ── Kill any previously installed service worker ────────────────────
// The SW was blocking video fetches by intercepting requests with an empty cache.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}

// ── Init ────────────────────────────────────────────────────────────
layout(false);  // place without animation
play(0);
goTo(0, false);


// Swipe hint: show once per session
if (sessionStorage.getItem('mz-hint')) {
  hint.classList.add('gone');
} else {
  setTimeout(() => {
    hint.classList.add('gone');
    sessionStorage.setItem('mz-hint', '1');
  }, 2600);
}
</script>
</body>
</html>
