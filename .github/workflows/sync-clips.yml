name: Sync Clips
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Generate clips.json from folders
        run: |
          python3 - <<'EOF'
          import json, os, glob, re
          def sort_key(name):
              stem = re.sub(r'\.mp4$', '', os.path.basename(name))
              try:
                  return (0, int(stem), stem)
              except ValueError:
                  return (1, 0, stem.lower())
          categories = []
          dirs = sorted([
              d for d in os.listdir('.')
              if os.path.isdir(d)
              and not d.startswith('.')
              and glob.glob(os.path.join(d, '*.mp4'))
          ], key=str.lower)
          for d in dirs:
              mp4s = sorted(glob.glob(os.path.join(d, '*.mp4')), key=sort_key)
              clips = [{"src": f, "label": re.sub(r'\.mp4$', '', os.path.basename(f))} for f in mp4s]
              categories.append({"name": d, "clips": clips})
              print(f"Category '{d}': {len(clips)} clip(s)")
          root_mp4s = sorted(glob.glob('*.mp4'), key=sort_key)
          if root_mp4s:
              clips = [{"src": f, "label": re.sub(r'\.mp4$', '', f)} for f in root_mp4s]
              categories.insert(0, {"name": "All", "clips": clips})
              print(f"Category 'All' (root): {len(clips)} clip(s)")
          with open('clips.json', 'w') as out:
              json.dump(categories, out, indent=2)
          print(f"\nDone: {len(categories)} category/categories written to clips.json")
          EOF
      - name: Commit clips.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clips.json
          if git diff --cached --quiet; then
            echo "clips.json unchanged, nothing to commit"
          else
            git commit -m "chore: sync clips.json [skip ci]"
            git push
          fi
